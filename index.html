<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Express - Plateforme de Restaurants</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=60') center/cover;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
        #session-header {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: none;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 0.9rem;
        }
        .hero {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px 40px;
        }
        .hero-content {
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hero h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2.2rem, 7vw, 3.8rem);
            font-weight: 800;
            color: white;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
        }
        .hero h1 span.brand-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hero h1 span.brand-title .accent {
            color: #e74c3c;
        }
        .brand-subtitle {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            color: rgba(255,255,255,0.6);
            margin-top: 6px;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
        }
        .hero p {
            color: rgba(255,255,255,0.8);
            font-size: clamp(1rem, 3.2vw, 1.25rem);
            margin-bottom: 36px;
            max-width: 540px;
            line-height: 1.6;
        }
        .hero-btns {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-hero-primary {
            background: #e74c3c;
            color: white;
            padding: 15px 38px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.05rem;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(231,76,60,0.35);
        }
        .btn-hero-primary:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231,76,60,0.5);
        }
        .btn-hero-secondary {
            background: rgba(255,255,255,0.12);
            color: white;
            padding: 15px 34px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
            border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.25s ease;
            backdrop-filter: blur(6px);
        }
        .btn-hero-secondary:hover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
        }
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 24px 20px;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }
        footer a {
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            margin: 0 8px;
            transition: color 0.2s;
        }
        footer a:hover {
            color: white;
        }
        .brand-credit {
            margin-top: 14px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            display: inline-block;
            background: rgba(0,0,0,0.35);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div id="session-header">
        <span id="session-username">Client</span>
        <button onclick="handleLogout()" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.2s;">Déconnexion</button>
    </div>

    <main class="hero">
        <div class="hero-content">
            <h1>
                <span class="brand-title">🍔 Gourmet <span class="accent">Express</span></span>
                <span class="brand-subtitle">by ITA INNOVATE</span>
            </h1>
            <p>Découvrez nos restaurants partenaires et commandez vos plats préférés, livrés chez vous ou à emporter.</p>
            <div class="hero-btns">
                <a href="login.html" class="btn-hero-primary" id="btn-order">Commander maintenant</a>
                <a href="login.html" class="btn-hero-secondary" id="btn-login">Se connecter</a>
                <a href="register.html" class="btn-hero-secondary" id="btn-register">Créer un compte</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Gourmet Express. Tous droits réservés.</p>
        <p style="margin-top:8px;">
            <a href="admin/index.html">Administration</a> •
            <a href="superadmin/index.html">Plateforme</a>
        </p>
        <p class="brand-credit">
            <span style="color:rgba(255,255,255,0.8); font-weight:500;">Réalisé par</span>
            <a href="http://www.itainnovate.com" target="_blank" class="blink-orange" style="text-decoration:none; color:#f39c12; font-weight:600;">ITA INNOVATE</a>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        function handleLogout() {
            DataManager.logout();
            window.location.reload();
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Session Detection for Header & CTA adaptation
            const client = DataManager.getCurrentClient();
            const staff = DataManager.getCurrentStaff();
            
            if (client || staff) {
                const header = document.getElementById('session-header');
                const username = document.getElementById('session-username');
                if (header && username) {
                    header.style.display = 'flex';
                    if (staff) {
                        username.textContent = `Bienvenue, ${staff.name || 'Admin'}`;
                    } else if (client) {
                        const fullName = `${client.firstname || ''} ${client.lastname || ''}`.trim();
                        username.textContent = `Bienvenue, ${fullName || 'Client'}`;
                    }
                }

                // If user is already logged in, redirect CTA directly
                const btnOrder = document.getElementById('btn-order');
                const btnLogin = document.getElementById('btn-login');
                const btnRegister = document.getElementById('btn-register');

                if (client) {
                    if (btnOrder) btnOrder.href = 'client/index.html';
                    if (btnLogin) btnLogin.style.display = 'none';
                    if (btnRegister) {
                        btnRegister.textContent = 'Mon Compte';
                        btnRegister.href = 'client/profile.html';
                    }
                } else if (staff) {
                    if (btnOrder) btnOrder.href = 'admin/index.html';
                    if (btnLogin) btnLogin.style.display = 'none';
                    if (btnRegister) btnRegister.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
