<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - ITAMYA</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/menu.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header-fixed">
        <a href="index.html" class="nav-back-container">
            <span style="font-size: 24px;">←</span>
            <span class="nav-back-text">Accueil</span>
        </a>
        <h2 style="font-size: 1.15rem; margin: 0; font-family:'Poppins', sans-serif;">Notre Carte</h2>
        <div style="display:flex; align-items:center; gap:10px;">
            <a href="client/orders.html" id="client-orders-header-btn" style="display:none; text-decoration:none; font-size:0.82rem; font-weight:700; color:#e63946; background:#fff1f2; padding:6px 12px; border-radius:8px; border:1.5px solid #fecdd3;">Mes Commandes</a>
            <a href="cart.html" style="position: relative; font-size: 1.3rem; text-decoration: none;">
                Panier
                <span class="badge cart-counter" style="display: none;">0</span>
            </a>
        </div>
    </header>

    <!-- Barre dynamique de choix de restaurant -->
    <div class="restaurant-switcher-bar" id="restaurant-switcher-bar">
        <div class="current-resto-badge">
            <div class="resto-avatar-img" id="switcher-resto-avatar">R</div>
            <div class="resto-texts">
                <span class="label">Établissement</span>
                <span class="name" id="switcher-resto-name">ITAMYA</span>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <select id="restaurant-switcher-select" class="switcher-select" onchange="switchRestaurantFromMenu(this.value)">
                <option value="">Changer de restaurant ▾</option>
            </select>
        </div>
    </div>

    <div class="category-scroll" id="category-filter">
        <!-- JS renders categories here -->
    </div>

    <div class="container product-grid" id="menu-container">
        <!-- JS renders products here -->
    </div>

    <a href="cart.html" class="btn btn-primary btn-floating">
        Voir mon panier (<span class="cart-counter">0</span>)
    </a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/menu.js"></script>
</body>

</html>
