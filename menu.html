<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Menu - ITAMYA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ITAMYA">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">
    <link rel="stylesheet" href="assets/css/style.css?v=3">
    <link rel="stylesheet" href="assets/css/menu.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header-fixed">
        <a href="index.html" class="nav-back-container">
            <span style="font-size: 22px;">←</span>
            <span class="nav-back-text">Accueil</span>
        </a>
        <h2 class="menu-header-title">Notre Carte</h2>
        <div class="menu-header-actions">
            <a href="client/orders.html" id="client-orders-header-btn" class="header-orders-btn" style="display:none;">Commandes</a>
            <a href="cart.html" class="header-cart-pill" id="header-cart-pill">
                <span>Panier</span>
                <span class="header-cart-count cart-counter" id="header-cart-count">0</span>
                <span class="header-cart-total" id="header-cart-total" style="display:none;">0 FCFA</span>
            </a>
        </div>
    </header>

    <!-- Barre dynamique de choix de restaurant -->
    <div class="restaurant-switcher-bar" id="restaurant-switcher-bar">
        <div class="current-resto-badge">
            <div class="resto-avatar-img" id="switcher-resto-avatar">R</div>
            <div class="resto-texts">
                <span class="label">Établissement</span>
                <span class="name" id="switcher-resto-name">ITAMYA</span>
            </div>
        </div>
        <div class="switcher-select-wrapper">
            <select id="restaurant-switcher-select" class="switcher-select" onchange="switchRestaurantFromMenu(this.value)">
                <option value="">Changer de restaurant ▾</option>
            </select>
        </div>
    </div>

    <div class="category-scroll" id="category-filter">
        <!-- JS renders categories here -->
    </div>

    <div class="container product-grid" id="menu-container">
        <!-- JS renders products here -->
    </div>

    <!-- Barre de Calcul Progressif en Temps Réel du Total à Payer -->
    <div class="live-cart-bar" id="live-cart-bar">
        <div class="live-cart-inner">
            <!-- Liste progressive des plats choisis au fur et à mesure -->
            <div class="live-cart-items-strip" id="live-cart-items-strip" style="display: none;">
                <!-- Rempli dynamiquement au fur et à mesure -->
            </div>

            <!-- Résumé Total à payer & Bouton Commander -->
            <div class="live-cart-main-row">
                <div class="live-cart-summary">
                    <span class="live-cart-count-label" id="live-cart-count-label">TOTAL À PAYER • 0 repas choisi</span>
                    <div class="live-cart-total-wrap">
                        <span class="live-cart-total-amount" id="live-cart-total-amount">0 FCFA</span>
                    </div>
                </div>
                <div class="live-cart-actions">
                    <button type="button" class="live-cart-clear-btn" id="live-cart-clear-btn" onclick="clearLiveCart()" style="display: none;" title="Vider la sélection">
                        Vider
                    </button>
                    <a href="cart.html" class="live-cart-order-btn empty" id="live-cart-order-btn">
                        Voir le panier
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js?v=3"></script>
    <script src="assets/js/data.js?v=3"></script>
    <script src="assets/js/app.js?v=3"></script>
    <script src="assets/js/mobile.js?v=3"></script>
    <script src="assets/js/menu.js?v=3"></script>
</body>

</html>
