<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gourmet Express</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Aptos', 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        }
        .login-wrapper { width: 100%; max-width: 440px; }
        .login-logo { text-align: center; margin-bottom: 24px; }
        .login-logo .brand { font-family: 'Poppins', sans-serif; font-size: 1.8rem; font-weight: 700; color: white; }
        .login-logo .tagline { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-top: 4px; }
        
        .login-card {
            background: white;
            border-radius: 20px;
            padding: clamp(22px, 6vw, 34px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            border: 1.5px solid #e2e8f0;
        }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 700; font-size: 0.88rem; color: #334155; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px; /* 16px prevents iOS automatic zoom on focus */
            font-family: inherit;
            transition: all 0.2s;
            box-sizing: border-box;
            background: #f8fafc;
            min-height: 48px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.55);
        }
        .btn-login:disabled { opacity: 0.7; transform: none; cursor: not-allowed; }
        
        .error-box {
            background: #fef2f2;
            color: #b91c1c;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #fecdd3;
            font-size: 0.88rem;
            margin-bottom: 18px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
        
        .link-row { text-align: center; margin-top: 22px; font-size: 0.9rem; color: #64748b; }
        .link-row a { color: #2563eb; font-weight: 700; text-decoration: none; }
        .link-row a:hover { text-decoration: underline; }
        
        .back-link { text-align: center; margin-bottom: 20px; }
        .back-link a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        .back-link a:hover { color: white; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="back-link"><a href="index.html">← Retour à l'accueil</a></div>

        <div class="login-logo" style="display:flex; flex-direction:column; align-items:center;">
            <img src="assets/images/logogourmet.png" alt="Logo Gourmet Express" style="height: 105px; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));">
            <div class="brand">Gourmet Express</div>
            <div style="font-size:0.85rem; font-weight:700; letter-spacing:2px; color:rgba(255,255,255,0.5); margin-top:4px; text-transform:uppercase;">by ITA INNOVATE</div>
            <div class="tagline" style="margin-top:6px;">Espace de Connexion</div>
        </div>

        <div class="login-card">
            <div id="error-box" class="error-box"></div>

            <form id="unified-login-form" onsubmit="handleUnifiedLogin(event)">
                <div class="form-group">
                    <label for="login-identifier">Identifiant</label>
                    <input type="text" id="login-identifier" placeholder="Email ou Numéro de téléphone" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login" id="btn-submit">Se connecter</button>
            </form>

            <div class="link-row">
                Pas encore de compte ? <a href="register.html">Créer un compte</a>
            </div>
        </div>

        <div style="text-align:center; margin-top:24px; font-size:0.75rem; letter-spacing:1px; font-weight:700;">
            <span style="color:#ffffff; font-weight:500;">Réalisé par</span> <a href="http://www.itainnovate.com" target="_blank" class="blink-orange" style="text-decoration:none; color:#f39c12;">ITA INNOVATE</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/data.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Auto redirect if already logged in
            const client = DataManager.getCurrentClient();
            const staff = DataManager.getCurrentStaff();

            if (staff) {
                if (staff.role === 'superadmin') {
                    window.location.href = 'superadmin/index.html';
                } else {
                    window.location.href = 'admin/index.html';
                }
            } else if (client) {
                window.location.href = 'client/index.html';
            }
        });

        function showError(msg) {
            const el = document.getElementById('error-box');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function clearError() {
            const el = document.getElementById('error-box');
            el.style.display = 'none';
            el.textContent = '';
        }

        async function handleUnifiedLogin(e) {
            e.preventDefault();
            clearError();

            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value;

            if (!identifier || !password) {
                showError('Veuillez renseigner votre identifiant et mot de passe.');
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.textContent = 'Connexion en cours...';

            const result = await DataManager.loginUnified(identifier, password);

            if (result.success) {
                window.location.href = result.redirectUrl || 'index.html';
            } else {
                showError(result.message || 'Identifiant ou mot de passe incorrect.');
                btn.disabled = false;
                btn.textContent = 'Se connecter';
            }
        }
    </script>
</body>
</html>
