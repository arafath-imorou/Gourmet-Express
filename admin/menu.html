<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion du Menu - Gourmet Express</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-nav {
            display: flex;
            gap: 12px;
            padding: 14px 20px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 24px;
            align-items: center;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.92rem;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1.5px solid transparent;
        }

        /* 1. Commandes : Rouge / Corail */
        .btn-nav-orders {
            background: #fff1f2;
            color: #e11d48;
            border-color: #fecdd3;
        }
        .btn-nav-orders:hover, .btn-nav-orders.active {
            background: #e11d48;
            color: white !important;
            border-color: #e11d48;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
        }

        /* 2. Menu : Ambre / Orange */
        .btn-nav-menu {
            background: #fffbeb;
            color: #d97706;
            border-color: #fde68a;
        }
        .btn-nav-menu:hover, .btn-nav-menu.active {
            background: #d97706;
            color: white !important;
            border-color: #d97706;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);
        }

        /* 3. Clients : Indigo / Bleu */
        .btn-nav-clients {
            background: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }
        .btn-nav-clients:hover, .btn-nav-clients.active {
            background: #2563eb;
            color: white !important;
            border-color: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        /* 4. Administration : Violet / Pourpre */
        .btn-nav-admin {
            background: #f5f3ff;
            color: #7c3aed;
            border-color: #ddd6fe;
        }
        .btn-nav-admin:hover, .btn-nav-admin.active {
            background: #7c3aed;
            color: white !important;
            border-color: #7c3aed;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
        }

        .category-pills {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 18px;
        }

        .cat-pill {
            background: white;
            border: 1.5px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.88rem;
            color: #475569;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-pill.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .menu-card {
            background: white;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
        }

        .menu-card-cover {
            height: 140px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 2.5rem;
        }

        .menu-card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .menu-card-body {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .menu-card-cat {
            font-size: 0.75rem;
            font-weight: 800;
            color: #7e22ce;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .menu-card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .menu-card-desc {
            font-size: 0.82rem;
            color: #64748b;
            flex: 1;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .menu-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
        }
    </style>
</head>

<body style="background: #f8fafc; font-family: 'Inter', sans-serif;">

    <!-- Desktop Nav -->
    <div class="admin-nav desktop-only">
        <div style="display:flex; align-items:center; gap:8px; margin-right:16px;">
            <span id="nav-resto-logo" style="font-size:1.3rem;">🏪</span>
            <span id="nav-restaurant-name" style="font-weight:800; color:var(--primary-color); font-size:1.05rem;">Restaurant</span>
        </div>
        <a href="index.html" class="nav-btn btn-nav-orders">📋 Commandes</a>
        <a href="menu.html" class="nav-btn btn-nav-menu active">📦 Menu</a>
        <a href="clients.html" class="nav-btn btn-nav-clients">👥 Clients</a>
        <a href="administration.html" class="nav-btn btn-nav-admin">📈 Administration</a>
        <div style="flex:1"></div>
        <a href="../superadmin/index.html" id="nav-superadmin-link" style="display:none; background:#f3e8ff; color:#7e22ce; padding:8px 14px; border-radius:10px; font-weight:700; text-decoration:none; margin-right:12px; font-size:0.85rem; border:1px solid #d8b4fe;">🏪 Superadmin</a>
        <button onclick="logout()" style="background:#f1f5f9; border:none; color: #475569; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size:0.9rem;">🚪 Déconnexion</button>
    </div>

    <!-- Mobile Header -->
    <div class="mobile-only" style="background: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; margin-bottom: 16px;">
        <span style="font-weight: 700; font-size: 1.05rem;" id="mobile-restaurant-name">Menu</span>
        <div style="display:flex; gap:8px; align-items:center;">
            <a href="index.html" class="nav-btn btn-nav-orders" style="padding:6px 10px; font-size:0.85rem;">📋</a>
            <a href="menu.html" class="nav-btn btn-nav-menu active" style="padding:6px 10px; font-size:0.85rem;">📦</a>
            <a href="clients.html" class="nav-btn btn-nav-clients" style="padding:6px 10px; font-size:0.85rem;">👥</a>
            <a href="administration.html" class="nav-btn btn-nav-admin" style="padding:6px 10px; font-size:0.85rem;">📈</a>
            <button onclick="logout()" style="background: #f1f5f9; border: none; font-size: 1rem; padding:6px 10px; border-radius:8px; cursor:pointer;">🚪</button>
        </div>
    </div>

    <div class="container" style="max-width: 1100px; padding: 0 16px 40px 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
            <div>
                <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a; margin-bottom: 4px;">📦 Gestion des Produits du Menu</h1>
                <p style="color: #64748b; font-size: 0.95rem; margin: 0;">Ajoutez, modifiez vos produits et gérez leur disponibilité en temps réel.</p>
            </div>
            <a href="menu-edit.html" class="btn btn-primary" style="width: auto; padding: 10px 18px; font-weight: 700; border-radius: 10px; text-decoration: none;">+ Ajouter un produit</a>
        </div>

        <!-- Filter & Search Bar -->
        <div style="display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;">
            <input type="text" id="search-product" placeholder="🔍 Rechercher un produit..." style="flex:1; min-width:220px; padding:10px 14px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:0.95rem;" oninput="filterMenu()">
        </div>

        <!-- Category Pills -->
        <div class="category-pills">
            <button class="cat-pill active" onclick="setCategoryFilter('all', this)">🍽️ Tous les produits</button>
            <button class="cat-pill" onclick="setCategoryFilter('Repas', this)">🍲 Repas</button>
            <button class="cat-pill" onclick="setCategoryFilter('Boissons', this)">🥤 Boissons</button>
            <button class="cat-pill" onclick="setCategoryFilter('Glaces', this)">🍦 Glaces</button>
        </div>

        <!-- Menu Grid -->
        <div id="admin-menu-list" class="menu-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">Chargement des produits...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        let allProducts = [];
        let currentCategory = 'all';

        document.addEventListener('DOMContentLoaded', async () => {
            const staff = DataManager.getCurrentStaff();
            if (staff && staff.role === 'superadmin') {
                const superadminLink = document.getElementById('nav-superadmin-link');
                if (superadminLink) superadminLink.style.display = 'inline-block';
            }

            if (staff && (staff.role === 'admin' || staff.role === 'staff' || staff.role === 'agent' || staff.role === 'superadmin')) {
                const nameEl = document.getElementById('nav-restaurant-name');
                if (nameEl) nameEl.textContent = staff.restaurant_name || 'Restaurant';
                const mobNameEl = document.getElementById('mobile-restaurant-name');
                if (mobNameEl) mobNameEl.textContent = staff.restaurant_name || 'Menu';

                if (staff.restaurant_logo) {
                    const logoEl = document.getElementById('nav-resto-logo');
                    if (logoEl) logoEl.innerHTML = `<img src="${staff.restaurant_logo}" style="width:28px; height:28px; border-radius:6px; object-fit:cover;">`;
                }

                await loadRestaurantMenu();
            } else {
                window.location.href = '../login.html';
            }
        });

        async function loadRestaurantMenu() {
            const staff = DataManager.getCurrentStaff();
            const restaurantId = staff ? staff.restaurant_id : null;
            if (!restaurantId) return;

            allProducts = await DataManager.getMenu(restaurantId);
            renderMenuGrid();
        }

        function setCategoryFilter(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderMenuGrid();
        }

        function filterMenu() {
            renderMenuGrid();
        }

        function renderMenuGrid() {
            const container = document.getElementById('admin-menu-list');
            if (!container) return;

            const query = (document.getElementById('search-product')?.value || '').toLowerCase().trim();

            const filtered = allProducts.filter(item => {
                const catMatch = (currentCategory === 'all') || (item.category === currentCategory);
                const queryMatch = !query || (item.name && item.name.toLowerCase().includes(query)) || (item.description && item.description.toLowerCase().includes(query));
                return catMatch && queryMatch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px 20px; background: white; border-radius: 12px; border: 1px dashed #cbd5e1;">
                        <p style="color:#64748b; font-size:1.05rem; margin-bottom:12px;">Aucun produit ne correspond à ces critères.</p>
                        <a href="menu-edit.html" class="btn btn-primary" style="width:auto; display:inline-block; text-decoration:none;">+ Ajouter un produit</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="menu-card">
                    <div class="menu-card-cover">
                        ${item.image ? `<img src="${item.image}" alt="${item.name}">` : '🍽️'}
                    </div>
                    <div class="menu-card-body">
                        <div class="menu-card-cat">${item.category || 'Repas'}</div>
                        <div class="menu-card-title">${item.name}</div>
                        <div class="menu-card-desc">${item.description || 'Aucune description'}</div>
                        
                        <div style="margin-bottom: 12px;">
                            <span style="font-size:0.8rem; font-weight:700; padding:4px 8px; border-radius:6px; background:${item.available !== false && item.active !== false ? '#dcfce7' : '#fee2e2'}; color:${item.available !== false && item.active !== false ? '#15803d' : '#b91c1c'};">
                                ${item.available !== false && item.active !== false ? '✅ Disponible' : '❌ Épuisé / Inactif'}
                            </span>
                        </div>

                        <div class="menu-card-footer">
                            <span style="font-size:1.15rem; font-weight:800; color:#0f172a;">${new Intl.NumberFormat('fr-FR').format(item.price)} F</span>
                            <div style="display:flex; gap:6px;">
                                <a href="menu-edit.html?id=${item.id}" class="btn btn-secondary btn-sm" style="padding:6px 10px; text-decoration:none;" title="Modifier">✏️</a>
                                <button onclick="toggleProduct('${item.id}', ${item.available !== false && item.active !== false})" class="btn btn-secondary btn-sm" style="padding:6px 10px;" title="Activer / Désactiver">🔄</button>
                                <button onclick="deleteProduct('${item.id}', '${item.name.replace(/'/g, "\\'")}')" class="btn btn-secondary btn-sm" style="padding:6px 10px; color:#ef4444;" title="Supprimer">🗑️</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function toggleProduct(id, currentAvailable) {
            await DataManager.updateMenuItem(id, { available: !currentAvailable, active: !currentAvailable });
            await loadRestaurantMenu();
        }

        async function deleteProduct(id, name) {
            if (!confirm(`Supprimer définitivement le produit "${name}" du menu ?`)) return;
            await DataManager.deleteMenuItem(id);
            await loadRestaurantMenu();
        }

        function logout() {
            DataManager.logout();
            window.location.href = '../login.html';
        }
    </script>
</body>

</html>
