<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editer Plat - Gourmet Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        .admin-nav {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: white;
            border-bottom: 1px solid #eee;
            margin-bottom: 24px;
        }

        .form-card {
            background: white;
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>

<body style="background: #f0f2f5;">

    <div class="admin-nav">
        <a href="menu.html">← Annuler</a>
        <div style="font-weight: 700; flex:1; text-align: center;">Edition Plat</div>
        <div style="width: 60px;"></div> <!-- Spacer -->
    </div>

    <div class="container" style="max-width: 600px;">
        <div class="form-card">
            <h2 class="mb-4" id="page-title">Nouveau Plat</h2>

            <form id="product-form">
                <input type="hidden" id="product-id">

                <div class="input-group">
                    <label>Nom du plat</label>
                    <input type="text" id="name" required>
                </div>

                <div class="input-group">
                    <label>Prix (FCFA)</label>
                    <input type="number" id="price" required>
                </div>

                <div class="input-group">
                    <label>Catégorie</label>
                    <input type="text" id="category" required list="categories">
                    <datalist id="categories">
                        <option value="Burgers">
                        <option value="Pizzas">
                        <option value="Salades">
                        <option value="Boissons">
                        <option value="Desserts">
                    </datalist>
                </div>

                <div class="input-group">
                    <label>URL Image</label>
                    <input type="url" id="image" required placeholder="https://...">
                    <div id="image-preview"
                        style="margin-top: 8px; height: 150px; background: #f0f0f0; border-radius: 8px; background-size: cover; background-position: center; display: none;">
                    </div>
                </div>

                <div class="input-group">
                    <label>Description</label>
                    <textarea id="description" rows="3"></textarea>
                </div>

                <div class="input-group">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="active" checked style="width: auto;">
                        <span>Disponible à la vente</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const form = document.getElementById('product-form');

        // Load data if editing
        if (id) {
            document.getElementById('page-title').textContent = 'Modifier le plat';
            const menu = DataManager.getMenu();
            const product = menu.find(p => p.id === id);

            if (product) {
                document.getElementById('product-id').value = product.id;
                document.getElementById('name').value = product.name;
                document.getElementById('price').value = product.price;
                document.getElementById('category').value = product.category;
                document.getElementById('image').value = product.image;
                document.getElementById('description').value = product.description || '';
                document.getElementById('active').checked = product.active;

                updatePreview(product.image);
            }
        }

        // Image Preview
        document.getElementById('image').addEventListener('input', (e) => updatePreview(e.target.value));

        function updatePreview(url) {
            const preview = document.getElementById('image-preview');
            if (url) {
                preview.style.display = 'block';
                preview.style.backgroundImage = `url('${url}')`;
            } else {
                preview.style.display = 'none';
            }
        }

        // Handle Save
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const menu = DataManager.getMenu();
            const productId = document.getElementById('product-id').value;

            const newProduct = {
                id: productId || Date.now().toString(),
                name: document.getElementById('name').value,
                price: parseInt(document.getElementById('price').value),
                category: document.getElementById('category').value,
                image: document.getElementById('image').value,
                description: document.getElementById('description').value,
                active: document.getElementById('active').checked
            };

            if (productId) {
                // Update existing
                const index = menu.findIndex(p => p.id === productId);
                if (index !== -1) menu[index] = newProduct;
            } else {
                // Add new
                menu.push(newProduct);
            }

            DataManager.saveMenu(menu);
            window.location.href = 'menu.html';
        });
    </script>
</body>

</html>
