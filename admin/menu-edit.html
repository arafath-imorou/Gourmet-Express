<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editer Plat - Gourmet Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        .admin-nav {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: white;
            border-bottom: 1px solid #eee;
            margin-bottom: 24px;
        }

        .form-card {
            background: white;
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>

<body style="background: #f0f2f5;">

    <div class="admin-nav">
        <a href="menu.html">← Annuler</a>
        <div style="font-weight: 700; flex:1; text-align: center;">Edition Plat</div>
        <div style="width: 60px;"></div>
    </div>

    <div class="container" style="max-width: 600px;">
        <div class="form-card">
            <h2 class="mb-4" id="page-title">Nouveau Plat</h2>

            <form id="product-form">
                <input type="hidden" id="product-id">

                <div class="input-group">
                    <label>Nom du plat</label>
                    <input type="text" id="name" required placeholder="Ex: Burger Spécial">
                </div>

                <div class="input-group">
                    <label>Prix (FCFA)</label>
                    <input type="number" id="price" required placeholder="Ex: 5000">
                </div>

                <div class="input-group">
                    <label>Catégorie *</label>
                    <select id="category" required style="width:100%; padding:12px; border:1.5px solid #cbd5e1; border-radius:10px; font-weight:600; font-size:0.95rem; background:white;">
                        <option value="Repas">🍲 Repas</option>
                        <option value="Boissons">🥤 Boissons</option>
                        <option value="Glaces">🍦 Glaces</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Photo du plat (Conversion WEBP automatique)</label>
                    <input type="file" id="image-file" accept="image/*" style="margin-bottom: 8px;">
                    <input type="hidden" id="image" required>
                    <div id="image-preview"
                        style="margin-top: 8px; height: 160px; background: #f0f0f0; border-radius: 8px; background-size: cover; background-position: center; display: none;">
                    </div>
                </div>

                <div class="input-group">
                    <label>Description</label>
                    <textarea id="description" rows="3" placeholder="Ingrédients, accompagnements..."></textarea>
                </div>

                <div class="input-group">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="active" checked style="width: auto;">
                        <span>Disponible à la vente</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-save-menu">Enregistrer le plat</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const form = document.getElementById('product-form');

        document.addEventListener('DOMContentLoaded', async () => {
            if (id) {
                document.getElementById('page-title').textContent = 'Modifier le plat';
                const menu = await DataManager.getMenu();
                const product = menu.find(p => p.id === id);

                if (product) {
                    document.getElementById('product-id').value = product.id;
                    document.getElementById('name').value = product.name;
                    document.getElementById('price').value = product.price;
                    document.getElementById('category').value = product.category;
                    document.getElementById('image').value = product.image;
                    document.getElementById('description').value = product.description || '';
                    document.getElementById('active').checked = product.active !== false;
                    updatePreview(product.image);
                }
            }
        });

        // Image upload with automatic WEBP conversion
        document.getElementById('image-file').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                try {
                    const webpDataUrl = await DataManager.convertToWebP(file, 800, 0.82);
                    document.getElementById('image').value = webpDataUrl;
                    updatePreview(webpDataUrl);
                } catch (err) {
                    alert('Erreur lors de la conversion de l\'image en WebP.');
                }
            }
        });

        function updatePreview(url) {
            const preview = document.getElementById('image-preview');
            if (url) {
                preview.style.display = 'block';
                preview.style.backgroundImage = `url('${url}')`;
            } else {
                preview.style.display = 'none';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save-menu');
            btn.disabled = true;
            btn.textContent = 'Enregistrement...';

            const productId = document.getElementById('product-id').value;
            const itemData = {
                name: document.getElementById('name').value.trim(),
                price: parseFloat(document.getElementById('price').value),
                category: document.getElementById('category').value.trim(),
                image: document.getElementById('image').value || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=60',
                description: document.getElementById('description').value.trim(),
                active: document.getElementById('active').checked,
                available: document.getElementById('active').checked,
                restaurant_id: DataManager.getCurrentRestaurantId()
            };

            if (productId) {
                await DataManager.updateMenuItem(productId, itemData);
            } else {
                itemData.id = 'ITEM-' + Date.now().toString().slice(-6);
                await DataManager.addMenuItem(itemData);
            }

            window.location.href = 'menu.html';
        });
    </script>
</body>

</html>
