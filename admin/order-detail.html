<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails Commande - Gourmet Express</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-nav {
            display: flex;
            gap: 16px;
            padding: 14px 20px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 24px;
            align-items: center;
        }

        .admin-nav a {
            font-weight: 600;
            color: #64748b;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .admin-nav a.active, .admin-nav a:hover {
            color: var(--primary-color);
            background: #f8fafc;
        }

        .section-box {
            background: white;
            padding: 24px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
        }
    </style>
</head>

<body style="background: #f8fafc; font-family: 'Aptos', 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;">

    <!-- Desktop Nav -->
    <div class="admin-nav desktop-only">
        <!-- Left: Restaurant Brand -->
        <div style="display:flex; align-items:center; gap:8px; min-width:200px;">
            <span id="nav-resto-logo" style="font-size:1.3rem;">🏪</span>
            <span id="nav-restaurant-name" style="font-weight:800; color:var(--primary-color); font-size:1.05rem;">Restaurant</span>
        </div>

        <!-- Center: The 4 Buttons Centered -->
        <div style="display:flex; align-items:center; justify-content:center; gap:12px; flex:1;">
            <a href="index.html" class="nav-btn btn-nav-orders active">📋 Commandes</a>
            <a href="menu.html" class="nav-btn btn-nav-menu">📦 Menu</a>
            <a href="clients.html" class="nav-btn btn-nav-clients">👥 Clients</a>
            <a href="administration.html" class="nav-btn btn-nav-admin">📈 Administration</a>
        </div>

        <!-- Right: Actions -->
        <div style="display:flex; align-items:center; gap:8px; min-width:200px; justify-content:flex-end;">
            <button onclick="logout()" style="background:#f1f5f9; border:none; color: #475569; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size:0.9rem;">🚪 Déconnexion</button>
        </div>
    </div>

    <div class="container" style="max-width: 800px; padding: 0 16px 40px 16px;">
        
        <div style="margin-bottom: 16px;">
            <a href="index.html" style="text-decoration: none; color: #64748b; font-weight: 700; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 6px;">
                ← Retour aux commandes
            </a>
        </div>

        <!-- Top Actions -->
        <div class="section-box">
            <div style="display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <label style="font-weight:700; color:#334155; font-size:0.9rem;">Statut :</label>
                    <select id="status-select-desktop" style="padding: 8px 12px; border-radius: 8px; border: 1.5px solid #cbd5e1; font-weight: 700; font-size: 0.9rem;">
                        <option value="Nouvelle">🟡 Nouvelle</option>
                        <option value="En cours">🔵 En cours</option>
                        <option value="Livrée">🟢 Livrée</option>
                        <option value="Terminée">🟢 Terminée</option>
                        <option value="Annulée">🔴 Annulée</option>
                    </select>
                    <button onclick="updateStatusFromDesktop()" class="btn btn-primary" style="width: auto; padding: 8px 16px; font-weight: 700; border-radius: 8px;">Enregistrer</button>
                </div>
                <div style="display:flex; gap:8px;">
                    <button onclick="window.print()" class="btn btn-secondary" style="width: auto; padding: 8px 14px; font-weight: 700; border-radius: 8px;">🖨️ Imprimer</button>
                    <button onclick="deleteOrder()" class="btn btn-secondary" style="width: auto; padding: 8px 14px; color: #ef4444; border-color: #fca5a5; font-weight: 700; border-radius: 8px;">🗑️ Supprimer</button>
                </div>
            </div>
        </div>

        <!-- Order Information Box -->
        <div class="section-box">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 16px;">
                <div>
                    <h2 id="order-id" style="font-size: 1.4rem; font-weight: 800; color: #0f172a; margin-bottom: 4px;">CMD-...</h2>
                    <div class="text-sm text-muted" id="order-date" style="color:#64748b;">...</div>
                </div>
                <div id="order-status-badge"></div>
            </div>

            <h4 style="font-size: 0.95rem; font-weight: 800; color: #334155; margin-bottom: 12px; text-transform: uppercase;">👤 Informations Client</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; background: #f8fafc; padding: 16px; border-radius: 10px;">
                <div>
                    <div style="font-size:0.8rem; color:#64748b; font-weight:600;">Nom du Client</div>
                    <div style="font-weight:700; color:#0f172a; font-size:1rem;" id="client-name">...</div>
                </div>
                <div>
                    <div style="font-size:0.8rem; color:#64748b; font-weight:600;">Téléphone (WhatsApp)</div>
                    <div style="font-weight:700; color:#0f172a; font-size:1rem;" id="client-phone">...</div>
                </div>
                <div>
                    <div style="font-size:0.8rem; color:#64748b; font-weight:600;">Mode de Réception</div>
                    <div style="font-weight:700; color:#0f172a; font-size:1rem;" id="order-mode">...</div>
                </div>
                <div>
                    <div style="font-size:0.8rem; color:#64748b; font-weight:600;">Adresse de Livraison</div>
                    <div style="font-weight:700; color:#0f172a; font-size:1rem;" id="order-address">-</div>
                </div>
            </div>

            <div id="order-comment-box" style="display: none; background: #fffbeb; border: 1px solid #fef3c7; padding: 14px; border-radius: 10px; margin-bottom: 24px;">
                <div style="font-size:0.8rem; font-weight:800; color: #b45309; margin-bottom: 4px;">📝 Note / Détails du paiement</div>
                <div id="order-comment" style="color: #78350f; font-size: 0.92rem; line-height: 1.5;"></div>
            </div>

            <h4 style="font-size: 0.95rem; font-weight: 800; color: #334155; margin-bottom: 12px; text-transform: uppercase;">🍽️ Articles Commandés</h4>
            <div id="items-list" style="margin-bottom: 24px; border-top: 1px solid #f1f5f9;">
                <!-- Items rendered here -->
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 1.3rem; font-weight: 800; padding-top: 16px; border-top: 2px solid #e2e8f0;">
                <span>Total Payé</span>
                <span id="order-total" style="color: #e74c3c;">0 F CFA</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        let currentOrder = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const staff = DataManager.getCurrentStaff();
            if (staff) {
                const nameEl = document.getElementById('nav-restaurant-name');
                if (nameEl) nameEl.textContent = staff.restaurant_name || 'Restaurant';
                if (staff.restaurant_logo) {
                    const logoEl = document.getElementById('nav-resto-logo');
                    if (logoEl) logoEl.innerHTML = `<img src="${staff.restaurant_logo}" style="width:28px; height:28px; border-radius:6px; object-fit:cover;">`;
                }
            }

            if (!id) {
                alert('ID de commande manquant.');
                window.location.href = 'index.html';
                return;
            }

            const orders = await DataManager.getOrders();
            currentOrder = orders.find(o => o.id === id);

            if (!currentOrder) {
                alert('Commande introuvable.');
                window.location.href = 'index.html';
                return;
            }

            renderOrderDetails();
        });

        function renderOrderDetails() {
            document.getElementById('order-id').textContent = currentOrder.id;
            const d = new Date(currentOrder.date);
            document.getElementById('order-date').textContent = '📅 ' + d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });

            const statusBadge = document.getElementById('order-status-badge');
            statusBadge.innerHTML = `<span style="padding:6px 12px; border-radius:8px; font-weight:700; font-size:0.9rem; background:${getStatusBg(currentOrder.status)}; color:${getStatusColor(currentOrder.status)};">${currentOrder.status}</span>`;

            document.getElementById('status-select-desktop').value = currentOrder.status || 'Nouvelle';

            document.getElementById('client-name').textContent = currentOrder.client_name || currentOrder.clientName || 'Client';
            
            const phone = currentOrder.phone || '';
            const cleanPhone = phone.replace(/[^0-9]/g, '');
            const waUrl = cleanPhone ? `https://wa.me/229${cleanPhone.replace(/^229/, '')}` : null;
            document.getElementById('client-phone').innerHTML = phone ? `${phone} ${waUrl ? `<a href="${waUrl}" target="_blank" style="margin-left:6px; color:#25D366; text-decoration:none; font-weight:700;">💬 WhatsApp</a>` : ''}` : '-';

            const modeMap = { 'delivery': '🛵 Livraison à domicile', 'takeaway': '🥡 À emporter', 'dinein': '🍽️ Sur place' };
            document.getElementById('order-mode').textContent = modeMap[currentOrder.type] || currentOrder.type || 'Standard';
            document.getElementById('order-address').textContent = currentOrder.address || 'Non spécifiée';

            if (currentOrder.comment) {
                document.getElementById('order-comment-box').style.display = 'block';
                document.getElementById('order-comment').textContent = currentOrder.comment;
            }

            const itemsContainer = document.getElementById('items-list');
            itemsContainer.innerHTML = '';

            const items = currentOrder.items || [];
            if (items.length === 0) {
                itemsContainer.innerHTML = '<div style="padding:14px; color:#888;">Aucun détail sur les articles.</div>';
            } else {
                items.forEach(item => {
                    const row = document.createElement('div');
                    row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #f1f5f9;';
                    const name = item.frozenName || item.name || 'Produit';
                    const price = item.frozenPrice || item.price || 0;
                    const qty = item.quantity || 1;
                    row.innerHTML = `
                        <div>
                            <div style="font-weight:700; color:#0f172a;">${qty}x ${name}</div>
                            ${item.note ? `<div style="font-size:0.8rem; color:#64748b;">Note: ${item.note}</div>` : ''}
                        </div>
                        <div style="font-weight:700; color:#334155;">${new Intl.NumberFormat('fr-FR').format(price * qty)} F CFA</div>
                    `;
                    itemsContainer.appendChild(row);
                });
            }

            document.getElementById('order-total').textContent = new Intl.NumberFormat('fr-FR').format(currentOrder.total || 0) + ' F CFA';
        }

        async function updateStatusFromDesktop() {
            const newStatus = document.getElementById('status-select-desktop').value;
            await DataManager.updateOrderStatus(currentOrder.id, newStatus);
            currentOrder.status = newStatus;
            renderOrderDetails();
            alert('✅ Statut mis à jour : ' + newStatus);
        }

        async function deleteOrder() {
            if (!confirm(`Supprimer définitivement la commande ${currentOrder.id} ?`)) return;
            await DataManager.deleteOrder(currentOrder.id);
            window.location.href = 'index.html';
        }

        function getStatusBg(status) {
            switch (status) {
                case 'Nouvelle': return '#fef3c7';
                case 'En cours': return '#e0f2fe';
                case 'Livrée': return '#dcfce7';
                case 'Terminée': return '#dcfce7';
                case 'Annulée': return '#fee2e2';
                default: return '#f1f5f9';
            }
        }

        function getStatusColor(status) {
            switch (status) {
                case 'Nouvelle': return '#b45309';
                case 'En cours': return '#0369a1';
                case 'Livrée': return '#15803d';
                case 'Terminée': return '#15803d';
                case 'Annulée': return '#b91c1c';
                default: return '#475569';
            }
        }

        function logout() {
            DataManager.logout();
            window.location.href = '../login.html';
        }
    </script>
</body>

</html>
