<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails Commande - Gourmet Express</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        .section-box {
            background: white;
            padding: 24px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>

<body style="background: #f0f2f5;">

    <div class="client-header"
        style="background: white; padding: 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 16px;">
        <a href="orders.html" style="text-decoration: none; font-size: 1.2rem;">←</a>
        <div style="font-weight: 700;">Détails Commande</div>
    </div>

    <div class="container" style="max-width: 600px; padding-top: 24px;">
        <div class="section-box">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px;">
                <div>
                    <h2 id="order-id" style="font-size: 1.5rem; margin-bottom: 4px;">...</h2>
                    <div class="text-sm text-muted" id="order-date">...</div>
                </div>
                <div id="order-status-badge"></div>
            </div>

            <h4 class="mb-2">Articles</h4>
            <div id="items-list" style="margin-bottom: 24px; border-top: 1px solid #eee;">
                <!-- Rendered -->
            </div>

            <div
                style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; border-top: 2px solid #eee; padding-top: 16px;">
                <span>Total</span>
                <span id="order-total" style="color: var(--primary-color);">...</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/data.js"></script>
    <script>
        const client = DataManager.getCurrentClient();
        const isAdmin = sessionStorage.getItem('admin_token') === 'valid';

        // Redirect if NOT client AND NOT admin
        if (!client && !isAdmin) {
            window.location.href = '../login.html';
        }

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        const orders = DataManager.getOrders();
        const order = orders.find(o => o.id === id);

        // Check if order exists AND (belongs to client OR user is admin)
        if (!order || (!isAdmin && (!client || order.clientId !== client.id))) {
            alert('Commande introuvable ou accès refusé.');
            // Redirect based on role
            if (isAdmin) {
                window.location.href = '../admin/index.html';
            } else {
                window.location.href = 'orders.html';
            }
        } else {
            document.getElementById('order-id').textContent = order.id;
            document.getElementById('order-date').textContent = new Date(order.date).toLocaleString();

            // Status Config & Message
            function getStatusInfo(status) {
                switch (status) {
                    case 'ENVOYÉE': return { bg: '#3B82F6', msg: 'Votre commande a bien été envoyée' };
                    case 'APPROUVÉE': return { bg: '#F59E0B', msg: 'Votre commande a été approuvée par le restaurant' };
                    case 'EN PRÉPARATION': return { bg: '#F59E0B', msg: 'Votre commande est en cours de préparation' };
                    case 'PRÊTE': return { bg: '#10B981', msg: 'Votre commande est prête' };
                    case 'EN LIVRAISON': return { bg: '#F59E0B', msg: 'Votre commande est en cours de livraison' };
                    case 'LIVRÉE': return { bg: '#10B981', msg: 'Votre commande a été livrée' };
                    case 'ANNULÉE': return { bg: '#9CA3AF', msg: 'Votre commande a été annulée' };
                    default: return { bg: '#9CA3AF', msg: '' };
                }
            }

            const info = getStatusInfo(order.status);

            // Badge
            const badge = document.getElementById('order-status-badge');
            badge.innerHTML = `<span style="background: ${info.bg}; color: white; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 0.9rem;">${order.status}</span>`;

            // Message Banner
            const messageBox = document.createElement('div');
            messageBox.style.background = info.bg + '20'; // 20% opacity
            messageBox.style.color = info.bg;
            messageBox.style.padding = '16px';
            messageBox.style.borderRadius = '8px';
            messageBox.style.marginBottom = '24px';
            messageBox.style.fontWeight = '600';
            messageBox.style.textAlign = 'center';
            messageBox.textContent = info.msg;

            // Insert after header line
            badge.parentElement.insertAdjacentElement('afterend', messageBox);

            // Items
            const list = document.getElementById('items-list');
            order.items.forEach(item => {
                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.justifyContent = 'space-between';
                row.style.padding = '12px 0';
                row.style.borderBottom = '1px solid #eee';

                // Read snapshot name
                const name = item.frozenName || 'Produit';

                row.innerHTML = `
                    <div>${item.quantity}x ${name}</div>
                    <div>${new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'XOF', maximumFractionDigits: 0 }).format((item.frozenPrice || 0) * item.quantity)}</div>
                `;
                list.appendChild(row);
            });

            document.getElementById('order-total').textContent = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'XOF', maximumFractionDigits: 0 }).format(order.total);
        }
    </script>
</body>

</html>
