<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes - Gourmet Express</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        .order-card {
            background: white;
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
        }

        .order-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-Nouvelle {
            background: #EBF8FF;
            color: #3B82F6;
        }

        .status-En {
            background: #FFFBEB;
            color: #F59E0B;
        }

        /* En cours */
        .status-Terminée {
            background: #D1FAE5;
            color: #10B981;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            padding: 24px;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 400px;
        }

        .star-rating {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
        }

        .star-rating span {
            font-size: 2rem;
            cursor: pointer;
            color: #ddd;
            transition: color 0.2s;
        }

        .star-rating span.active {
            color: #FFD700;
        }
    </style>
</head>

<body style="background: #f0f2f5;">

    <div class="client-header"
        style="background: white; padding: 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 16px;">
        <a href="index.html" style="text-decoration: none; font-size: 1.2rem;">←</a>
        <div style="font-weight: 700;">Mes Commandes</div>
    </div>

    <div class="container" style="max-width: 600px; padding-top: 24px;">
        <div id="orders-list">
            <!-- Rendered by JS -->
            <p class="text-center text-muted">Chargement...</p>
        </div>
    </div>

    <!-- Review Modal -->
    <div id="review-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 class="mb-4 text-center">Noter la commande</h3>
            <div class="star-rating" id="star-container">
                <span data-value="1">★</span>
                <span data-value="2">★</span>
                <span data-value="3">★</span>
                <span data-value="4">★</span>
                <span data-value="5">★</span>
            </div>
            <textarea id="review-comment" class="input-field" rows="3" placeholder="Votre avis (optionnel)..."
                style="width: 100%; border: 1px solid #ddd; padding: 8px; border-radius: 8px; margin-bottom: 16px;"></textarea>

            <div style="display: flex; gap: 8px;">
                <button onclick="closeReviewModal()" class="btn btn-secondary" style="flex: 1;">Annuler</button>
                <button onclick="submitReview()" class="btn btn-primary" style="flex: 1;">Envoyer</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/data.js"></script>
    <script>
        // Auth Check
        const client = DataManager.getCurrentClient();
        const isAdmin = sessionStorage.getItem('admin_token') === 'valid';

        if (!client && !isAdmin) {
            window.location.href = '../login.html';
        }

        function renderOrders() {
            const container = document.getElementById('orders-list');
            const allOrders = DataManager.getOrders();

            // If admin, they probably shouldn't be here, but let's show all orders or redirect
            // For now, if admin and no client session, show empty or all
            const myOrders = client ? allOrders.filter(o => o.clientId === client.id) : (isAdmin ? allOrders : []);

            container.innerHTML = '';

            if (myOrders.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #888;">
                        <div style="font-size: 3rem; margin-bottom: 16px;">🍽️</div>
                        <p>Vous n'avez pas encore passé de commande.</p>
                        <a href="../menu.html" class="btn btn-primary" style="margin-top: 16px; display: inline-block;">Voir le menu</a>
                    </div>
                `;
                return;
            }

            myOrders.forEach(order => {
                const date = new Date(order.date).toLocaleDateString();
                const time = new Date(order.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const config = getStatusConfig(order.status);

                const div = document.createElement('div');
                div.className = 'order-card';

                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span class="font-bold">#${order.id.split('-')[1]}</span>
                        <span class="text-muted text-sm">${date} à ${time}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div class="font-bold">${formatPrice(order.total)}</div>
                            <div class="text-sm text-muted">${order.items.length} articles</div>
                        </div>
                        <span style="background: ${config.bg}; color: ${config.color}; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600;">${order.status}</span>
                    </div>
                    <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; text-align: right;">
                        <a href="order-detail.html?id=${order.id}" class="btn btn-secondary btn-sm" style="width: auto;">Voir détails</a>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'XOF', maximumFractionDigits: 0 }).format(price);
        }

        function getStatusConfig(status) {
            switch (status) {
                case 'ENVOYÉE': return { bg: '#EBF8FF', color: '#3B82F6' };
                case 'APPROUVÉE': return { bg: '#FFFBEB', color: '#F59E0B' };
                case 'EN PRÉPARATION': return { bg: '#FFFBEB', color: '#F59E0B' };
                case 'PRÊTE': return { bg: '#D1FAE5', color: '#10B981' };
                case 'EN LIVRAISON': return { bg: '#FFFBEB', color: '#F59E0B' };
                case 'LIVRÉE': return { bg: '#D1FAE5', color: '#10B981' };
                case 'ANNULÉE': return { bg: '#F3F4F6', color: '#9CA3AF' };
                default: return { bg: '#F3F4F6', color: '#9CA3AF' };
            }
        }

        // Logic
        let currentOrderIdToRate = null;
        let currentRating = 0;

        function renderOrders() {
            const container = document.getElementById('orders-list');
            const allOrders = DataManager.getOrders();
            // Filter for current client
            const myOrders = allOrders.filter(o => o.clientId === client.id);

            container.innerHTML = '';

            if (myOrders.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #888;">
                        <div style="font-size: 3rem; margin-bottom: 16px;">🍽️</div>
                        <p>Vous n'avez pas encore passé de commande.</p>
                        <a href="../menu.html" class="btn btn-primary" style="margin-top: 16px; display: inline-block;">Voir le menu</a>
                    </div>
                `;
                return;
            }

            myOrders.forEach(order => {
                const date = new Date(order.date).toLocaleDateString();
                const time = new Date(order.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const config = getStatusConfig(order.status);

                // Review Logic
                const review = DataManager.getReviewByOrder(order.id);
                let reviewAction = '';

                if (order.status === 'LIVRÉE') {
                    if (review) {
                        reviewAction = `<div style="text-align: right; margin-top: 8px; color: #FFD700;">${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}</div>`;
                    } else {
                        reviewAction = `<div style="text-align: right; margin-top: 8px;"><button onclick="openReviewModal('${order.id}')" class="btn btn-secondary btn-sm" style="background: white; border: 1px solid #FFD700; color: #DAA520;">⭐ Noter</button></div>`;
                    }
                }

                const div = document.createElement('div');
                div.className = 'order-card';

                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span class="font-bold">#${order.id.split('-')[1]}</span>
                        <span class="text-muted text-sm">${date} à ${time}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div class="font-bold">${formatPrice(order.total)}</div>
                            <div class="text-sm text-muted">${order.items.length} articles</div>
                        </div>
                        <span style="background: ${config.bg}; color: ${config.color}; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600;">${order.status}</span>
                    </div>
                    ${reviewAction}
                    <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; text-align: right;">
                        <a href="order-detail.html?id=${order.id}" class="btn btn-secondary btn-sm" style="width: auto;">Voir détails</a>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- Review Modal Logic ---
        function openReviewModal(orderId) {
            currentOrderIdToRate = orderId;
            currentRating = 0;
            updateStarDisplay();
            document.getElementById('review-comment').value = '';
            document.getElementById('review-modal').style.display = 'flex';
        }

        function closeReviewModal() {
            document.getElementById('review-modal').style.display = 'none';
            currentOrderIdToRate = null;
        }

        // Star Interaction
        document.querySelectorAll('.star-rating span').forEach(star => {
            star.addEventListener('click', (e) => {
                currentRating = parseInt(e.target.getAttribute('data-value'));
                updateStarDisplay();
            });
        });

        function updateStarDisplay() {
            document.querySelectorAll('.star-rating span').forEach(star => {
                const val = parseInt(star.getAttribute('data-value'));
                if (val <= currentRating) star.classList.add('active');
                else star.classList.remove('active');
            });
        }

        function submitReview() {
            if (!currentOrderIdToRate) return;
            if (currentRating === 0) {
                alert('Veuillez sélectionner une note (étoiles).');
                return;
            }

            const comment = document.getElementById('review-comment').value;

            DataManager.addReview({
                orderId: currentOrderIdToRate,
                clientId: client.id,
                rating: currentRating,
                comment: comment
            });

            closeReviewModal();
            renderOrders(); // Refresh to show stars
            alert('Merci pour votre avis !');
        }

        renderOrders();
    </script>
</body>

</html>
