<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - Gourmet Express</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        .auth-card {
            background: white;
            padding: 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            max-width: 400px;
            margin: 60px auto;
        }

        .step-hidden {
            display: none;
        }
    </style>
</head>

<body style="background: #f0f2f5;">

    <div class="container">
        <div style="text-align: center; margin-top: 40px;">
            <a href="login.html" class="nav-back-container" style="flex-direction: row; gap: 8px;">
                <span style="font-size: 24px;">←</span>
                <span>Retour</span>
            </a>
            <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary-color); margin-top: 16px;">
                Gourmet Express 🍔
            </div>
        </div>

        <div class="auth-card">
            <h2 class="text-center mb-4">Récupération</h2>

            <!-- STEP 1: Identification -->
            <form id="step-1-form">
                <p class="text-muted text-center text-sm mb-4">Entrez votre email ou téléphone pour recevoir un code de
                    vérification.</p>
                <div class="input-group">
                    <label>Email ou Téléphone</label>
                    <input type="text" id="identifier" required placeholder="email@exemple.com">
                </div>
                <button type="submit" class="btn btn-primary w-100">Envoyer le code</button>
            </form>

            <!-- STEP 2: Verification & Reset -->
            <form id="step-2-form" class="step-hidden">
                <p class="text-muted text-center text-sm mb-4">Un code a été envoyé à <b><span
                            id="target-display"></span></b></p>

                <div class="input-group">
                    <label>Code de vérification</label>
                    <input type="text" id="otp-input" required placeholder="Ex: 1234">
                </div>

                <div class="input-group">
                    <label>Nouveau mot de passe</label>
                    <input type="password" id="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Changer le mot de passe</button>
            </form>

            <div id="status-message" style="margin-top: 16px; text-align: center; font-size: 0.9rem;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/data.js"></script>
    <script>
        let generatedOTP = null;
        let currentIdentifier = null;

        // Step 1: Send Code
        document.getElementById('step-1-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value;

            // Validate user exists first
            const clients = DataManager.getClients();
            const normId = DataManager.normalize(identifier);
            const normPhone = DataManager.normalizePhone(identifier);
            const userExists = clients.find(c => c.email === normId || c.phone === normPhone);

            const status = document.getElementById('status-message');

            if (!userExists) {
                status.textContent = 'Aucun compte trouvé avec cet identifiant.';
                status.style.color = '#DC3545';
                return;
            }

            // Simulate sending code
            currentIdentifier = identifier;
            generatedOTP = Math.floor(1000 + Math.random() * 9000).toString(); // 4 digit code

            alert(`[SIMULATION SMS/EMAIL]\n\nVotre code de vérification est : ${generatedOTP}`);

            // Switch to Step 2
            document.getElementById('step-1-form').classList.add('step-hidden');
            document.getElementById('step-2-form').classList.remove('step-hidden');
            document.getElementById('target-display').textContent = identifier;
            status.textContent = '';
        });

        // Step 2: Verify & Update
        document.getElementById('step-2-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputOTP = document.getElementById('otp-input').value;
            const newPass = document.getElementById('new-password').value;
            const status = document.getElementById('status-message');

            if (inputOTP !== generatedOTP) {
                status.textContent = 'Code incorrect.';
                status.style.color = '#DC3545';
                return;
            }

            // Update Password
            const result = DataManager.updatePassword(currentIdentifier, newPass);

            if (result.success) {
                status.textContent = 'Mot de passe modifié avec succès ! Redirection...';
                status.style.color = '#10B981';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                status.textContent = 'Erreur lors de la mise à jour.';
                status.style.color = '#DC3545';
            }
        });
    </script>
</body>

</html>
