<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - ITAMYA</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        .auth-card {
            background: white;
            padding: 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            max-width: 400px;
            margin: 30px auto;
        }

        .step-hidden {
            display: none;
        }
    </style>
</head>

<body style="background: #f0f2f5;">

    <div class="container">
        <div style="text-align: center; margin-top: 30px;">
            <a href="login.html" class="nav-back-container" style="flex-direction: row; gap: 8px;">
                <span style="font-size: 20px;">←</span>
                <span>Retour</span>
            </a>
            <div style="display:flex; justify-content:center; margin-top: 14px;">
                <img src="assets/images/logoitamya.png" alt="Logo ITAMYA" style="height: 100px; object-fit: contain;">
            </div>
        </div>

        <div class="auth-card">
            <h2 class="text-center mb-4">Récupération</h2>

            <!-- STEP 1: Identification -->
            <form id="step-1-form">
                <p class="text-muted text-center text-sm mb-4">Entrez votre email ou téléphone pour recevoir un code de vérification.</p>
                <div class="input-group">
                    <label>Email ou Téléphone</label>
                    <input type="text" id="identifier" required placeholder="email@exemple.com">
                </div>
                <button type="submit" class="btn btn-primary w-100">Envoyer le code</button>
            </form>

            <!-- STEP 2: Verification & Reset -->
            <form id="step-2-form" class="step-hidden">
                <p class="text-muted text-center text-sm mb-4">Un code a été envoyé à <b><span id="target-display"></span></b></p>

                <div class="input-group">
                    <label>Code de vérification</label>
                    <input type="text" id="otp-input" required placeholder="Ex: 1234">
                </div>

                <div class="input-group">
                    <label>Nouveau mot de passe</label>
                    <input type="password" id="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Changer le mot de passe</button>
            </form>

            <div id="status-message" style="margin-top: 16px; text-align: center; font-size: 0.9rem;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/data.js"></script>
    <script>
        let generatedOTP = null;
        let currentIdentifier = null;

        // Step 1: Send Code
        document.getElementById('step-1-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value;

            // Validate user exists first
            const clients = await DataManager.getClients();
            const normId = DataManager.normalize(identifier);
            const normPhone = DataManager.normalizePhone(identifier);
            const userExists = clients.find(c => c.email === normId || c.phone === normPhone);

            const status = document.getElementById('status-message');

            if (!userExists) {
                status.textContent = 'Aucun compte trouvé avec cet identifiant.';
                status.style.color = '#DC3545';
                return;
            }

            // Simulate sending code
            currentIdentifier = identifier;
            generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();

            alert(`[Simulation SMS/Email] Votre code de récupération ITAMYA est : ${generatedOTP}`);

            document.getElementById('step-1-form').classList.add('step-hidden');
            document.getElementById('step-2-form').classList.remove('step-hidden');
            document.getElementById('target-display').textContent = identifier;
            status.textContent = '';
        });

        // Step 2: Verify & Reset
        document.getElementById('step-2-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp-input').value;
            const newPassword = document.getElementById('new-password').value;
            const status = document.getElementById('status-message');

            if (otp !== generatedOTP) {
                status.textContent = 'Code de vérification incorrect.';
                status.style.color = '#DC3545';
                return;
            }

            const normId = DataManager.normalize(currentIdentifier);
            const normPhone = DataManager.normalizePhone(currentIdentifier);
            const { error } = await window.supabaseClient
                .from('restau_clients')
                .update({ password: newPassword })
                .or(`email.eq.${normId},phone.eq.${normPhone}`);

            if (!error) {
                alert('Mot de passe mis à jour avec succès !');
                window.location.href = 'login.html';
            } else {
                status.textContent = 'Erreur lors de la mise à jour.';
                status.style.color = '#DC3545';
            }
        });
    </script>
</body>

</html>
